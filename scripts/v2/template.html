<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alundra Chest Atlas</title>
<style>
:root{--bg:#1b1c20;--panel:#25272d;--text:#e9e9ec;--muted:#9a9ca4;--border:#3a3d46;--accent:#f0b34a;--edit:#4cc2ff}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9e7e1;--panel:#fff;--text:#222;--muted:#6b6b6b;--border:#d4d0c4;--accent:#b8740c;--edit:#0a7fc2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,sans-serif;display:flex;height:100vh;overflow:hidden}
nav,aside{background:var(--panel);display:flex;flex-direction:column;min-height:0}
nav{width:210px;border-right:1px solid var(--border)}
aside{width:320px;border-left:1px solid var(--border)}
h1{font-size:15px;margin:0;padding:12px 14px 8px}
.list{overflow:auto;flex:1}
.map-btn{display:flex;justify-content:space-between;width:100%;padding:7px 14px;border:0;background:none;color:var(--text);text-align:left;cursor:pointer;font:inherit}
.map-btn:hover{background:var(--bg)}
.map-btn.on{background:var(--bg);box-shadow:inset 3px 0 var(--accent)}
.map-btn small{color:var(--muted)}
#stage{flex:1;position:relative;overflow:hidden;min-width:0;background:#000;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world img{display:block;image-rendering:pixelated;max-width:none}
.grid{position:absolute;inset:0;pointer-events:none}
.grid i{position:absolute;border:1px solid rgba(255,255,255,.35)}
.grid b{position:absolute;color:#fff;font-size:calc(40px*var(--inv));text-shadow:0 0 6px #000;opacity:.7}
.mk{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid #fff;transform:scale(var(--inv));box-shadow:0 0 0 2px #000,0 0 8px #000;cursor:pointer;display:grid;place-items:center;font-size:10px;font-weight:700;color:#000}
.mk.g{background:#3ecf5a}.mk.y{background:#f2d230}.mk.r{background:#ef4b4b}
.mk.hl{animation:pulse 1s 3}
.mk.dim{opacity:.15}
.mk.cand{background:transparent;border:2px dashed var(--edit);box-shadow:none;color:var(--edit);width:26px;height:26px;margin:-13px 0 0 -13px}
@keyframes pulse{50%{transform:scale(calc(var(--inv)*2.2))}}
#tip{position:fixed;pointer-events:none;background:#000d;color:#fff;padding:6px 9px;border-radius:6px;font-size:12px;z-index:5;display:none;max-width:260px}
.bar{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
input[type=search]{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px}
.row label{display:flex;gap:4px;align-items:center;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.src{padding:6px 14px;border-top:1px solid var(--border);cursor:pointer}
.src:hover{background:var(--bg)}
.src.sel{background:var(--bg);box-shadow:inset 3px 0 var(--edit)}
.src b{font-weight:500;display:block}
.src span{color:var(--muted);font-size:12px}
.src.un b::before{content:"○ ";color:var(--muted)}
.src.pl b::before{content:"● ";color:var(--accent)}
button.act{padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;font:inherit}
button.act.on{border-color:var(--edit);color:var(--edit)}
#editbar{display:none;font-size:12px;color:var(--edit)}
body.edit #editbar{display:block}
@media (max-width:900px){nav{width:140px}aside{width:240px}}
</style>
</head>
<body>
<nav><h1>Maps</h1><div class="list" id="maps"></div></nav>
<div id="stage"><div id="world"><img id="img" alt="" draggable="false"><div class="grid" id="grid"></div><div id="markers"></div></div></div>
<div id="tip"></div>
<aside>
  <div class="bar">
    <input id="q" type="search" placeholder="Search item or place (e.g. Life Vessel)">
    <div class="row" id="legend"></div>
    <div class="row">
      <button class="act" id="edit">Edit placements</button>
      <button class="act" id="export">Copy changes</button>
      <button class="act" id="reset">Reset</button>
    </div>
    <div id="editbar">Edit mode: drag a marker to move it. Select an unplaced entry below, then click the map (or a dashed ? spot) to place it. Right-click a marker to remove it.</div>
    <div class="row" id="stats"></div>
  </div>
  <div class="list" id="srcs"></div>
</aside>
<script>
const D = /*DATA*/null;
const CAT = { g: 'Exact chest', y: 'Chest here, which one unsure', r: 'Approximate location' };
const itemName = i => !i ? '—' : typeof i === 'string' ? i : `${i.name} ×${i.quantity}`;
const conf = i => (place(i) && place(i).c) || 'g';
const $ = id => document.getElementById(id);
const store = { get() { try { return JSON.parse(localStorage.getItem('alundra-atlas-v2')) || {}; } catch (e) { return {}; } }, set(v) { try { localStorage.setItem('alundra-atlas-v2', JSON.stringify(v)); } catch (e) {} } };

// placements: base data overlaid with the user's local edits (null = removed)
let edits = store.get();
const place = i => i in edits ? edits[i] : D.placements[i];
const mapById = Object.fromEntries(D.maps.map(m => [m.id, m]));
let cur = D.maps[0], editing = false, selected = null, view = { x: 0, y: 0, k: 1 };
const hidden = new Set();

function allSourcesOn(m) {
  const list = D.sources.map((_, i) => i).filter(i => place(i) && place(i).map === m.id);
  m.sources.forEach(i => { if (!place(i)) list.push(i); });
  return list;
}

function renderMaps() {
  $('maps').innerHTML = '';
  D.maps.forEach(m => {
    const total = m.sources.length, placed = m.sources.filter(i => place(i) && place(i).map === m.id).length;
    const b = document.createElement('button');
    b.className = 'map-btn' + (m === cur ? ' on' : '');
    b.innerHTML = `<span></span><small>${placed}/${total}</small>`;
    b.firstChild.textContent = m.title;
    b.onclick = () => { cur = m; selected = null; load(); };
    $('maps').append(b);
  });
}

function load() {
  $('world').style.visibility = 'hidden';
  $('img').onload = () => { fit(); $('world').style.visibility = 'visible'; };
  $('img').src = 'maps/' + cur.file;
  $('img').width = cur.w; $('img').height = cur.h;
  const g = $('grid'); g.innerHTML = '';
  if (cur.id === 'world') {
    for (let c = 0; c < 5; c++) for (let r = 0; r < 4; r++) {
      const x = c * 1249.4, y = r * 961;
      const i = document.createElement('i'); i.style.cssText = `left:${x}px;top:${y}px;width:1249px;height:961px`; g.append(i);
      const b = document.createElement('b'); b.textContent = 'ABCDE'[c] + (r + 1); b.style.cssText = `left:${x + 14}px;top:${y + 8}px`; g.append(b);
    }
  }
  renderMaps(); render();
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  const mk = $('markers'); mk.innerHTML = '';
  const list = allSourcesOn(cur), srcs = $('srcs'); srcs.innerHTML = '';
  let placed = 0;
  list.forEach(i => {
    const s = D.sources[i], p = place(i), onMap = p && p.map === cur.id, cat = conf(i);
    const hit = !q || (s.name + ' ' + itemName(s.item) + ' ' + s.node).toLowerCase().includes(q);
    if (onMap) {
      placed++;
      const m = document.createElement('div');
      m.className = `mk ${cat}` + (hit ? '' : ' dim') + (hidden.has(cat) ? ' dim' : '');
      m.style.left = p.x + 'px'; m.style.top = p.y + 'px'; m.dataset.i = i;
      m.onmouseenter = e => tip(e, `<b>${esc(s.name)}</b><br>${esc(itemName(s.item))}<br><i>${esc(D.regionOf[i])} · ${CAT[cat]}</i>`);
      m.onmouseleave = () => $('tip').style.display = 'none';
      m.onpointerdown = e => { if (!editing) return; e.stopPropagation(); startDrag(e, i, m); };
      m.oncontextmenu = e => { if (!editing) return; e.preventDefault(); setPlace(i, null); };
      m.onclick = () => focusList(i);
      mk.append(m);
    }
    if (!hit && q) return;
    const row = document.createElement('div');
    row.className = 'src ' + (p ? 'pl' : 'un') + (selected === i ? ' sel' : '');
    row.dataset.i = i;
    row.innerHTML = `<b></b><span></span>`;
    row.firstChild.textContent = s.name;
    row.lastChild.textContent = `${itemName(s.item)} · ${D.regionOf[i]}${onMap ? '' : p ? ` · on ${mapById[p.map].title}` : ' · not placed'}`;
    row.onclick = () => { if (onMap) flash(i); if (editing) { selected = selected === i ? null : i; render(); } };
    srcs.append(row);
  });
  if (editing) {
    cur.candidates.forEach(([x, y]) => {
      if (list.some(i => place(i) && place(i).map === cur.id && Math.hypot(place(i).x - x, place(i).y - y) < 20)) return;
      const c = document.createElement('div'); c.className = 'mk cand'; c.textContent = '?';
      c.style.left = x + 'px'; c.style.top = y + 'px';
      c.onpointerdown = e => e.stopPropagation();
      c.onclick = e => { e.stopPropagation(); if (selected !== null) { setPlace(selected, { map: cur.id, x, y }); } };
      mk.append(c);
    });
  }
  $('stats').textContent = `${placed} of ${cur.sources.length} sources placed on this map`;
  document.body.classList.toggle('edit', editing);
  $('edit').classList.toggle('on', editing);
  applyView();
}
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function tip(e, html) { const t = $('tip'); t.innerHTML = html; t.style.display = 'block'; t.style.left = e.clientX + 14 + 'px'; t.style.top = e.clientY + 14 + 'px'; }

function setPlace(i, p) {
  edits[i] = p ? { c: 'g', ...p } : null;
  if (!p && !(i in D.placements)) delete edits[i];
  store.set(edits); selected = p ? null : selected; renderMaps(); render();
}

function flash(i) {
  const m = document.querySelector(`.mk[data-i="${i}"]`); if (!m) return;
  const p = place(i), r = $('stage').getBoundingClientRect();
  view.x = r.width / 2 - p.x * view.k; view.y = r.height / 2 - p.y * view.k; applyView();
  m.classList.remove('hl'); void m.offsetWidth; m.classList.add('hl');
}
function focusList(i) {
  const row = document.querySelector(`.src[data-i="${i}"]`); if (row) row.scrollIntoView({ block: 'center' });
}

function startDrag(e, i, el) {
  const move = ev => { const p = toImage(ev); el.style.left = p.x + 'px'; el.style.top = p.y + 'px'; };
  const up = ev => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); const p = toImage(ev); setPlace(i, { map: cur.id, x: Math.round(p.x), y: Math.round(p.y) }); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}
function toImage(e) { const r = $('stage').getBoundingClientRect(); return { x: (e.clientX - r.left - view.x) / view.k, y: (e.clientY - r.top - view.y) / view.k }; }

// pan / zoom
const stage = $('stage');
function applyView() { const w = $('world'); w.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; w.style.setProperty('--inv', 1 / view.k); }
function fit() { const r = stage.getBoundingClientRect(); view.k = Math.min(r.width / cur.w, r.height / cur.h); view.x = (r.width - cur.w * view.k) / 2; view.y = (r.height - cur.h * view.k) / 2; applyView(); }
let drag = null;
stage.onpointerdown = e => { drag = { x: e.clientX - view.x, y: e.clientY - view.y, sx: e.clientX, sy: e.clientY }; stage.classList.add('drag'); };
addEventListener('pointerup', e => {
  if (drag && editing && selected !== null && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4 && e.target === stage || (drag && editing && selected !== null && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4 && e.target.tagName === 'IMG')) {
    const p = toImage(e); setPlace(selected, { map: cur.id, x: Math.round(p.x), y: Math.round(p.y) });
  }
  drag = null; stage.classList.remove('drag');
});
addEventListener('pointermove', e => { if (drag) { view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; applyView(); } });
stage.addEventListener('wheel', e => {
  e.preventDefault(); const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, f = Math.exp(-e.deltaY * 0.0015);
  view.x = mx - (mx - view.x) * f; view.y = my - (my - view.y) * f; view.k *= f; applyView();
}, { passive: false });
addEventListener('resize', fit);

// controls
$('q').oninput = render;
$('edit').onclick = () => { editing = !editing; selected = null; render(); };
$('reset').onclick = () => { if (confirm('Discard all your local placement edits?')) { edits = {}; store.set(edits); renderMaps(); render(); } };
$('export').onclick = () => {
  const lines = Object.keys(edits).map(i => { const p = edits[i], s = D.sources[i]; return p ? `['${p.map}', ${p.x}, ${p.y}, '${s.node}', ${JSON.stringify(s.name)}],` : `// removed: ${s.node} / ${s.name}`; });
  const text = lines.join('\n') || '// no changes';
  navigator.clipboard.writeText(text).then(() => alert(`Copied ${lines.length} change(s). Paste them into scripts/v2/assignments.js (replacing entries for the same chest) and rebuild.`), () => prompt('Copy:', text));
};
$('legend').innerHTML = Object.entries(CAT).map(([k, v]) => `<label><input type="checkbox" checked data-c="${k}"><span class="dot mk ${k}" style="width:10px;height:10px;margin:0;border-width:1px;transform:none;box-shadow:none"></span>${v}</label>`).join('');
$('legend').onchange = e => { e.target.checked ? hidden.delete(e.target.dataset.c) : hidden.add(e.target.dataset.c); render(); };
load();
</script>
</body>
</html>
